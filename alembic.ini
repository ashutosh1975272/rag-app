# Alembic config. The live URL always comes from the DATABASE_URL
# environment variable (see alembic/env.py); sqlalchemy.url below is only
# a local-dev fallback and never holds a secret.
[alembic]
script_location = alembic
sqlalchemy.url = postgresql+psycopg://rag:rag@localhost:55434/rag

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
